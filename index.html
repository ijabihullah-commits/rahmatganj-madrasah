<title>মাদরাসা তথ্যভান্ডার</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6B50">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar (name + save status + scrollable tabs), one working column up to 1040px, tables scroll inside their own box, modals for forms */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#13231D; --muted:#566860; --line:#D8E1DB;
  --accent:#1D6B50; --accent-ink:#FFFFFF; --accent-soft:#E0EFE8;
  --good:#1B6E43; --good-soft:#DCF0E3;
  --warn:#8F5208; --warn-soft:#FBEBD2;
  --bad:#A62F1D; --bad-soft:#F8E0DA;
  --font-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --font-display:'Noto Serif Bengali','Hind Siliguri',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#15221D; --ink:#E6EFEA; --muted:#97AAA1; --line:#273A32;
  --accent:#5CC49C; --accent-ink:#06130E; --accent-soft:#17352B;
  --good:#6FD39A; --good-soft:#163523;
  --warn:#F0B35A; --warn-soft:#3A2A10;
  --bad:#F28B79; --bad-soft:#40201A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15221D; --ink:#E6EFEA; --muted:#97AAA1; --line:#273A32;
  --accent:#5CC49C; --accent-ink:#06130E; --accent-soft:#17352B;
  --good:#6FD39A; --good-soft:#163523;
  --warn:#F0B35A; --warn-soft:#3A2A10;
  --bad:#F28B79; --bad-soft:#40201A;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:21px;min-width:0;overflow-wrap:anywhere}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:10px 13px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-top:22px;display:flex;flex-direction:column;gap:26px}
section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
td.nm{min-width:150px}
td.wide{min-width:220px}
td.top{vertical-align:top}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical;min-height:92px}
input.mk{width:76px;text-align:center;padding:6px 4px;min-height:36px}
input.mk.over{border-color:var(--bad);background:var(--bad-soft)}
input.hf{min-width:140px;padding:6px 8px;min-height:36px}
select.hf{min-width:110px;padding:6px 8px;min-height:36px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gh{font-size:14px;color:var(--accent);padding-top:12px;border-top:1px solid var(--line);margin-bottom:-4px}
.modal h3.gh:first-of-type{border-top:0;padding-top:0}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.filters2{display:flex;gap:10px;flex-wrap:wrap}
.filters2 .f{flex:1 1 180px;min-width:0}

.chip{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.25}
.stat span{display:block;font-size:13px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 14px;font-weight:600;min-height:38px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--good);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="L"]{background:var(--warn);color:#fff}

.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.barrow{display:flex;align-items:center;gap:10px;min-width:150px}
.barrow .bar{flex:1}
.barrow b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.dist{display:grid;grid-template-columns:minmax(90px,170px) 1fr 70px;gap:10px 12px;align-items:center}
.dist .num{text-align:right;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.cells i{height:24px;border-radius:4px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.cells i.on{background:var(--accent);color:var(--accent-ink)}

.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 18px}
.empty p{max-width:46ch}
.note{border:1px solid var(--line);background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}

.ov{position:fixed;inset:0;z-index:40;background:rgba(8,18,14,.58);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:20px;margin:auto;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:560px){.filters{grid-template-columns:1fr}h2{font-size:18px}.dist{grid-template-columns:minmax(80px,120px) 1fr 56px}}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,nav.tabs a{transition:background-color .12s,border-color .12s,color .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="brand">মাদরাসা তথ্যভান্ডার</h1>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span id="status" class="chip warn" role="status">সংযোগ হচ্ছে…</span><button id="logoutBtn" class="btn sm" type="button" style="display:none">লগআউট</button></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="প্রধান মেনু"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="ov" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="authGate" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto">
 <section class="card" style="width:100%;max-width:430px;display:flex;flex-direction:column;gap:14px">
  <h2>মাদরাসা তথ্যভান্ডার</h2><p class="muted">শিক্ষক, প্রশাসক ও অভিভাবকের জন্য নিরাপদ লগইন</p>
  <button id="googleLogin" class="btn primary" type="button">Google দিয়ে প্রবেশ করুন</button>
  <div class="f"><label for="loginEmail">ইমেইল</label><input id="loginEmail" type="email" autocomplete="username" placeholder="name@example.com"></div>
  <div class="f"><label for="loginPassword">পাসওয়ার্ড</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড"></div>
  <div class="btns"><button id="emailLogin" class="btn" type="button">ইমেইল দিয়ে লগইন</button><button id="emailSignup" class="btn" type="button">নতুন অ্যাকাউন্ট</button></div>
  <p id="authMessage" class="muted small">প্রথম প্রশাসক হিসেবে ijabihullah@gmail.com ব্যবহার করুন।</p>
 </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
var COLS=['students','attendance','exams','settings','courses','routine','teachers','tattendance','hifz','conduct','notices'];
var S={};COLS.forEach(function(c){S[c]={};});
var BN='০১২৩৪৫৬৭৮৯';
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var DAYS=['শনিবার','রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার'];
var CTYPES=['প্রশংসা','সতর্কতা','শৃঙ্খলাজনিত','কাউন্সেলিং','মাসিক মূল্যায়ন'];
var CCHIP={'প্রশংসা':'good','সতর্কতা':'warn','শৃঙ্খলাজনিত':'bad','কাউন্সেলিং':'','মাসিক মূল্যায়ন':'plain'};
var RATES=['ভালো','মোটামুটি','দুর্বল'];
var HIFZ='হিফজ';
var DEFAULTS={name:'জামিয়া ইসলামিয়া এহইয়াউল উলূম রহমতগঞ্জ মাদরাসা',address:'মুদাফরগঞ্জ, বরুড়া, কুমিল্লা',
  classes:['শিশু','নূরানী-১ম','নূরানী-২য়','নূরানী-৩য়','নাযেরা','হিফয','ইয়াযদহম','তাইসীর','মীযান','নাহবেমীর','হেদায়াতুন্নাহু','কাফিয়া','শরহে জামী','শরহে বেকায়া','জালালাইন','মেশকাত','দাওরা'],
  depts:['নূরানি','হিফজ','কিতাব','অন্যান্য'],
  passPct:33,minAtt:75,weakPct:45,
  grades:[{n:'মুমতায',min:80},{n:'জায়্যিদ জিদ্দান',min:65},{n:'জায়্যিদ',min:50},{n:'মাকবুল',min:35},{n:'রাসিব',min:0}]};

var $=function(s){return document.querySelector(s);};
var bn=function(v){return String(v==null?'':v).replace(/[0-9]/g,function(d){return BN[d];});};
var en=function(v){return String(v).replace(/[০-৯]/g,function(d){return BN.indexOf(d);});};
var num=function(v){var n=parseFloat(en(String(v==null?'':v).trim()));return isNaN(n)?null:n;};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var todayStr=function(){return ymd(new Date());};
var fmtDate=function(s){if(!s)return '';var p=s.split('-');return bn(p[2]+'/'+p[1]+'/'+p[0]);};
var fp=function(x){return bn(Math.round(x*10)/10);};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var uniq=function(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x);});return o;};

/* ---------- settings ---------- */
var OLD_CLASSES=['নূরানি','হিফজ','প্রথম জামাত','দ্বিতীয় জামাত','তৃতীয় জামাত','চতুর্থ জামাত','পঞ্চম জামাত'].join('|');
function settings(){var s=S.settings.main||{};var o={};for(var k in DEFAULTS)o[k]=(s[k]!=null&&s[k]!=='')?s[k]:DEFAULTS[k];
  if(Array.isArray(s.classes)&&s.classes.join('|')===OLD_CLASSES)o.classes=DEFAULTS.classes;
  if(s.name==='আমার মাদরাসা')o.name=DEFAULTS.name;
  if(!o.classes.length)o.classes=DEFAULTS.classes;if(!o.depts.length)o.depts=DEFAULTS.depts;return o;}
function gradeOf(pct){var g=settings().grades.slice().sort(function(a,b){return b.min-a.min;});for(var i=0;i<g.length;i++){if(pct>=g[i].min)return g[i].n;}return g.length?g[g.length-1].n:'';}

/* ---------- storage ---------- */
var LS='madrasa-tothvandar-v1';
var dbx=null,dl=null,mode='connecting',timedOut=false,loaded={};
var role='pending',myId=null,G=null,gLoaded=false;
var ROLEL={admin:'প্রশাসক',teacher:'শিক্ষক',guardian:'অভিভাবক'};
function guardianView(){return role==='guardian'||(role==='unknown'&&!!G&&!Object.keys(S.students).length);}
function adminOnly(fn){return function(){if(role==='teacher'){toast('এই কাজ শুধু প্রশাসক করতে পারেন','bad');return;}return fn.apply(this,arguments);};}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){COLS.forEach(function(c){S[c]=j[c]||{};});}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));return true;}catch(e){if(mode==='local'){mode='memory';renderStatus();}return false;}}
var chains={};
function queue(key,fn){chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(function(e){console.error(e);toast('সংরক্ষণ করা যায়নি। শুধু দেখার অনুমতি থাকলে এমন হতে পারে।','bad');});return chains[key];}
function put(col,id,data){S[col][id]=data;if(mode==='cloud')queue(col+'/'+id,function(){return dbx.collection(col).doc(id).set(data);});else saveLocal();}
function del(col,id){delete S[col][id];if(mode==='cloud')queue(col+'/'+id,function(){return dbx.collection(col).doc(id).delete();});else saveLocal();}
function isReady(){if(mode==='connecting')return false;if(role==='guardian')return gLoaded||timedOut;if(mode!=='cloud')return true;return timedOut||COLS.every(function(c){return loaded[c];});}

/* ---------- UI state ---------- */
var U={nt:{tpl:'ছুটি',cls:'',d1:todayStr(),d2:'',note:'',msg:''},q:'',fcls:'',attDate:todayStr(),attCls:'',att:{},examId:null,markDraft:{},editId:null,confirm:null,restoreText:'',modalKind:null,subjTouched:false,
  acCls:'',tDate:todayStr(),tatt:{},hfDate:todayStr(),hfCls:'',hfSid:'',hfDraft:{},cdCls:'',cdType:'',rpMonth:'',rpExam:''};
var tab='overview';
var TABS=[['overview','ওভারভিউ'],['students','ছাত্র'],['attendance','উপস্থিতি'],['academic','একাডেমিক'],['exams','পরীক্ষা'],['hifz','হিফজ'],['conduct','তারবিয়াত'],['teachers','শিক্ষক'],['notice','বিজ্ঞপ্তি'],['reports','রিপোর্ট'],['backup','ব্যাকআপ ও সেটিং']];
function route(){var h=location.hash.slice(1);tab=TABS.some(function(t){return t[0]===h;})?h:'overview';}

/* ---------- helpers ---------- */
function ci(c){var i=settings().classes.indexOf(c);return i<0?999:i;}
function cmpStudent(a,b){var x=ci(a.cls)-ci(b.cls);if(x)return x;var ra=num(a.roll),rb=num(b.roll);x=(ra==null?1e9:ra)-(rb==null?1e9:rb);if(x)return x;return String(a.name).localeCompare(String(b.name),'bn');}
function studentsOf(cls){return Object.keys(S.students).map(function(id){var s=clone(S.students[id]);s.id=id;return s;}).filter(function(s){return !cls||s.cls===cls;}).sort(cmpStudent);}
function classOptions(sel,withAll){var cl=settings().classes,o=withAll?'<option value="">সব জামাত</option>':'';cl.forEach(function(c){o+='<option value="'+esc(c)+'"'+(c===sel?' selected':'')+'>'+esc(c)+'</option>';});if(sel&&cl.indexOf(sel)<0)o+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';return o;}
function studentOptions(cls,sel){return studentsOf(cls).map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+bn(esc(s.roll))+(s.roll?'. ':'')+esc(s.name)+'</option>';}).join('');}
function studentName(id){var s=S.students[id];return s?s.name:'(মুছে ফেলা ছাত্র)';}
function teachersList(){return Object.keys(S.teachers).map(function(id){var t=clone(S.teachers[id]);t.id=id;return t;}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'bn');});}
function teacherName(id){var t=S.teachers[id];return t?t.name:'';}
function teacherOptions(sel){return '<option value="">নির্ধারিত নয়</option>'+teachersList().map(function(t){return '<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>';}).join('');}
function coursesOf(cls){return Object.keys(S.courses).sort().filter(function(id){return S.courses[id].cls===cls;}).map(function(id){var c=clone(S.courses[id]);c.id=id;return c;});}
function toast(msg,kind){var t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='bad'?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},3200);}
function chipFor(rate){return rate>=90?'good':(rate>=75?'warn':'bad');}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvRow(a){return a.map(csvCell).join(',');}
function barRow(label,pct,text){return '<div>'+esc(label)+'</div><div class="bar" role="img" aria-label="'+esc(label)+' '+esc(text)+'"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div><div class="num"><b>'+esc(text)+'</b></div>';}
function delBtn(kind,act){return '<button class="btn danger'+(U.confirm===kind?' sure':'')+'" data-act="'+act+'" style="margin-left:auto">'+(U.confirm===kind?'নিশ্চিত করুন, মুছে ফেলুন':'মুছে ফেলুন')+'</button>';}
function confirmDel(kind,reopen,doIt){if(U.confirm!==kind){U.confirm=kind;reopen();return;}doIt();closeModal();render();toast('মুছে ফেলা হয়েছে');}
function emptyCard(title,text,href,label){return '<section class="card empty"><h2>'+title+'</h2><p class="muted">'+text+'</p><a class="btn primary" href="#'+href+'">'+label+'</a></section>';}
function segBtns(act,sid,cur){return '<div class="seg" role="group">'+[['P','উপস্থিত'],['A','অনুপস্থিত'],['L','ছুটি']].map(function(o){return '<button type="button" data-act="'+act+'" data-sid="'+sid+'" data-v="'+o[0]+'" aria-pressed="'+(o[0]===cur?'true':'false')+'">'+o[1]+'</button>';}).join('')+'</div>';}

function vOverview(){
  var all=studentsOf('');if(!all.length)return emptyState();
  var t=todayStr(),rec=(S.attendance[t]||{}).records||{};
  var p=0,a=0,l=0;all.forEach(function(s){var v=rec[s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++;});
  var marked=p+a+l,rate=marked?Math.round(p/marked*100):null;
  var order=uniq(all.map(function(s){return s.cls;}));
  var rows=order.map(function(c){var ss=all.filter(function(s){return s.cls===c;}),cp=0,ca=0,cl=0;ss.forEach(function(s){var v=rec[s.id];if(v==='P')cp++;else if(v==='A')ca++;else if(v==='L')cl++;});
    var un=ss.length-cp-ca-cl;
    return '<tr><td class="nm"><b>'+esc(c)+'</b></td><td class="num">'+bn(ss.length)+'</td><td class="num">'+bn(cp)+'</td><td class="num">'+bn(ca)+'</td><td class="num">'+bn(cl)+'</td><td class="num">'+(un===ss.length?'<span class="chip plain">নেওয়া হয়নি</span>':bn(un))+'</td></tr>';}).join('');
  var exams=Object.keys(S.exams).map(function(id){var e=clone(S.exams[id]);e.id=id;return e;});
  var recent=exams.slice(-3).reverse().map(function(e){return '<tr><td class="nm"><b>'+esc(e.name)+'</b>'+(e.sample?' <span class="chip plain">উদাহরণ</span>':'')+'</td><td>'+esc(e.cls)+'</td><td class="num">'+bn(esc(e.year||''))+'</td><td><button class="btn sm" data-act="openExam" data-id="'+e.id+'">খুলুন</button></td></tr>';}).join('');
  var nt=Object.keys(S.teachers).length;
  return '<section class="block"><div class="stats">'
   +'<div class="stat"><b>'+bn(all.length)+'</b><span>মোট ছাত্র, '+bn(order.length)+'টি জামাতে</span></div>'
   +'<div class="stat"><b>'+(rate==null?'—':bn(rate)+'%')+'</b><span>'+(rate==null?'আজকের উপস্থিতি এখনো নেওয়া হয়নি':'আজ উপস্থিত '+bn(p)+' জন, অনুপস্থিত '+bn(a)+' জন')+'</span></div>'
   +'<div class="stat"><b>'+bn(exams.length)+'</b><span>পরীক্ষা তৈরি হয়েছে</span></div>'
   +(nt?'<div class="stat"><b>'+bn(nt)+'</b><span>শিক্ষক ও কর্মী</span></div>':'')+'</div></section>'
   +'<section class="block"><div class="rowhead"><h2>জামাতভিত্তিক আজকের অবস্থা</h2><a class="btn sm" href="#attendance">উপস্থিতি নিন</a></div><div class="tablewrap"><table><thead><tr><th>জামাত</th><th class="num">ছাত্র</th><th class="num">উপস্থিত</th><th class="num">অনুপস্থিত</th><th class="num">ছুটি</th><th class="num">বাকি</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'
   +(recent?'<section class="block"><div class="rowhead"><h2>সাম্প্রতিক পরীক্ষা</h2><a class="btn sm" href="#exams">সব পরীক্ষা</a></div><div class="tablewrap"><table><thead><tr><th>পরীক্ষা</th><th>জামাত</th><th class="num">সাল</th><th></th></tr></thead><tbody>'+recent+'</tbody></table></div></section>':'');
}

function saveStudent(){
  var v=function(i){return document.getElementById(i).value.trim();};
  if(!v('f-name')){toast('ছাত্রের নাম লিখুন','bad');return;}
  if(!v('f-cls')){toast('জামাত নির্বাচন করুন','bad');return;}
  var roll=v('f-roll'),cls=v('f-cls');
  if(roll){var dup=Object.keys(S.students).some(function(k){var o=S.students[k];return k!==U.editId&&o.cls===cls&&num(o.roll)!=null&&num(o.roll)===num(roll);});if(dup){toast('এই জামাতে এই রোল আগে থেকে আছে','bad');return;}}
  var gu=v('f-guid');
  if(gu&&(!/^[A-Za-z0-9_.~:@+-]{1,200}$/.test(gu)||gu==='.'||gu==='..')){toast('অভিভাবকের কোডটি সঠিক নয়। অভিভাবকের অ্যাপে দেখানো কোড হুবহু পেস্ট করুন','bad');return;}
  var id=U.editId||uid(),old=S.students[id]||{};
  put('students',id,{gUid:gu,name:v('f-name'),roll:roll,cls:cls,father:v('f-father'),guardian:v('f-guard'),rel:v('f-rel'),occ:v('f-occ'),phone:v('f-phone'),phone2:v('f-phone2'),emer:v('f-emer'),address:v('f-addr'),admitted:v('f-adm'),residence:v('f-res'),dept:v('f-dept'),year:en(v('f-year')),sample:!!old.sample});
  closeModal();render();toast('ছাত্রের তথ্য সংরক্ষিত হয়েছে');
}

function attPaint(){
  var body=$('#attbody');if(!body)return;var done=0,total=0;
  body.querySelectorAll('tr').forEach(function(tr){total++;var st=statusOf(tr.dataset.sid);if(st)done++;tr.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===st?'true':'false');});});
  var c=$('#attcount');if(c)c.textContent='চিহ্নিত '+bn(done)+' / '+bn(total);
}
function monthSummary(people,col,date,nameOf){
  var pre=date.slice(0,7),y=+pre.slice(0,4),m=+pre.slice(5,7);
  var days=Object.keys(S[col]).filter(function(d){return d.indexOf(pre)===0;});
  var head='<section class="block"><h2>'+MONTHS[m-1]+' '+bn(y)+' মাসের সারাংশ</h2>';
  var data=people.map(function(s){var p=0,a=0,l=0;days.forEach(function(d){var v=(S[col][d].records||{})[s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++;});return {s:s,p:p,a:a,l:l,t:p+a+l};});
  if(!data.some(function(r){return r.t;}))return head+'<p class="muted">এই মাসে উপস্থিতি এখনো সংরক্ষিত হয়নি।</p></section>';
  return head+'<div class="tablewrap"><table><thead><tr><th>'+(col==='attendance'?'রোল':'')+'</th><th>নাম</th><th class="num">উপস্থিত</th><th class="num">অনুপস্থিত</th><th class="num">ছুটি</th><th class="num">হার</th></tr></thead><tbody>'
   +data.map(function(r){var rate=r.t?Math.round(r.p/r.t*100):null;return '<tr><td class="num">'+(col==='attendance'?bn(esc(r.s.roll)):'')+'</td><td class="nm">'+esc(nameOf(r.s))+'</td><td class="num">'+bn(r.p)+'</td><td class="num">'+bn(r.a)+'</td><td class="num">'+bn(r.l)+'</td><td class="num">'+(rate==null?'—':'<span class="chip '+chipFor(rate)+'">'+bn(rate)+'%</span>')+'</td></tr>';}).join('')
   +'</tbody></table></div></section>';
}
function attMonth(ss){return monthSummary(ss,'attendance',U.attDate,function(s){return s.name;});}
function attSave(){
  var doc=S.attendance[U.attDate]?clone(S.attendance[U.attDate]):{date:U.attDate,records:{}};
  doc.records=doc.records||{};var n=0;
  studentsOf(U.attCls).forEach(function(s){var st=statusOf(s.id);if(st){doc.records[s.id]=st;n++;}});
  if(!n){toast('কাউকে চিহ্নিত করা হয়নি','bad');return;}
  doc.date=U.attDate;put('attendance',U.attDate,doc);delete U.att[attKey()];render();toast('উপস্থিতি সংরক্ষিত হয়েছে');
}

/* ---------- academic (বিভাগ ৪: কিতাব, শিক্ষক বণ্টন, রুটিন) ---------- */
function routineOf(cls){return Object.keys(S.routine).filter(function(id){return S.routine[id].cls===cls;}).map(function(id){var r=clone(S.routine[id]);r.id=id;return r;})
  .sort(function(a,b){return (a.day-b.day)||String(a.start).localeCompare(String(b.start));});}

  var cl=settings().classes;if(!U.acCls||cl.indexOf(U.acCls)<0)U.acCls=cl[0];
  var cs=coursesOf(U.acCls),rt=routineOf(U.acCls);
  var crow=cs.map(function(c){return '<tr><td class="nm"><b>'+esc(c.name)+'</b>'+(c.sample?' <span class="chip plain">উদাহরণ</span>':'')+'</td><td>'+(teacherName(c.teacherId)?esc(teacherName(c.teacherId)):'<span class="muted">নির্ধারিত নয়</span>')+'</td><td><button class="btn sm" data-act="editCourse" data-id="'+c.id+'">সম্পাদনা</button></td></tr>';}).join('');
  var lastDay=-1;
  var rrow=rt.map(function(r){var co=r.courseId&&S.courses[r.courseId],label=co?co.name:(r.label||'—'),tn=co?teacherName(co.teacherId):'';

  return '<section class="block"><h2>একাডেমিক রেকর্ড</h2><div class="filters2"><div class="f"><label for="acCls">জামাত</label><select id="acCls" data-ch="acCls">'+classOptions(U.acCls,false)+'</select></div></div></section>'
   +'<section class="block"><div class="rowhead"><h2>কিতাব ও শিক্ষক বণ্টন</h2><button class="btn primary" data-act="newCourse">কিতাব যোগ করুন</button></div>'
   +(cs.length?'<div class="tablewrap"><table><thead><tr><th>কিতাব/বিষয়</th><th>শিক্ষক</th><th></th></tr></thead><tbody>'+crow+'</tbody></table></div><p class="muted small">নতুন পরীক্ষা তৈরির সময় এই জামাতের কিতাবগুলো নিজে থেকে বসে যাবে।</p>'
     :'<div class="card empty"><p class="muted">এই জামাতের কোনো কিতাব যোগ করা হয়নি। কিতাব যোগ করলে শিক্ষক বণ্টন করা যাবে।</p></div>')+'</section>'
   +'<section class="block"><div class="rowhead"><h2>সাপ্তাহিক ক্লাস রুটিন</h2><button class="btn primary" data-act="newRoutine">ক্লাস যোগ করুন</button></div>'
   +(rt.length?'<div class="tablewrap"><table><thead><tr><th>দিন</th><th class="num">সময়</th><th>কিতাব/বিষয়</th><th>শিক্ষক</th><th></th></tr></thead><tbody>'+rrow+'</tbody></table></div>'
     :'<div class="card empty"><p class="muted">এই জামাতের রুটিন এখনো তৈরি হয়নি।</p></div>')+'</section>';
}

   +'<div class="f"><label for="f-rlabel">অন্য ক্লাস বা টীকা</label><input id="f-rlabel" value="'+esc(r.label||'')+'" placeholder="যেমন নামাজ, বিরতি" autocomplete="off"></div></div>'

function saveRoutine(){
  var v=function(i){return document.getElementById(i).value.trim();};
  if(!v('f-rstart')||!v('f-rend')){toast('শুরু ও শেষের সময় দিন','bad');return;}
  if(v('f-rend')<=v('f-rstart')){toast('শেষের সময় শুরুর পরে হতে হবে','bad');return;}
  if(!v('f-rcourse')&&!v('f-rlabel')){toast('কিতাব বেছে নিন অথবা ক্লাসের নাম লিখুন','bad');return;}
  var id=U.editId||uid(),old=S.routine[id]||{};
  put('routine',id,{cls:old.cls||U.acCls,day:+v('f-rday'),start:v('f-rstart'),end:v('f-rend'),courseId:v('f-rcourse'),label:v('f-rlabel'),sample:!!old.sample});
  closeModal();render();toast('সংরক্ষিত হয়েছে');
}

/* ---------- exams ---------- */
function calc(ex,vals){
  var total=0,max=0,filled=0,fail=false,over=false,pp=settings().passPct;
  ex.subjects.forEach(function(s,i){max+=s.max;var v=vals[i];var n=(v===''||v==null)?null:num(v);if(n!=null){filled++;total+=n;if(n>s.max)over=true;if(n<s.max*pp/100)fail=true;}});
  var complete=filled===ex.subjects.length,pct=max?total/max*100:0;
  return {total:total,max:max,filled:filled,complete:complete,pct:pct,fail:fail,over:over,grade:complete?gradeOf(pct):'',result:complete?(fail?'অনুত্তীর্ণ':'উত্তীর্ণ'):'অসম্পূর্ণ'};
}
function getVals(ex,sid,noDraft){var sv=(ex.marks||{})[sid]||{},d=!noDraft&&U.markDraft[ex.id]&&U.markDraft[ex.id][sid];return d?Object.assign({},sv,d):sv;}
function examRows(ex,noDraft){
  var rows=studentsOf(ex.cls).map(function(s){var vals=getVals(ex,s.id,noDraft);return {s:s,vals:vals,c:calc(ex,vals)};});
  var passed=rows.filter(function(r){return r.c.complete&&!r.c.fail&&!r.c.over;}).sort(function(a,b){return b.c.total-a.c.total;});
  passed.forEach(function(r,i){r.rank=(i>0&&r.c.total===passed[i-1].c.total)?passed[i-1].rank:i+1;});
  return rows;
}
function getExam(id){var e=S.exams[id];if(!e)return null;e=clone(e);e.id=id;e.marks=e.marks||{};return e;}
function vExams(){
  var ex=U.examId&&getExam(U.examId);if(ex)return vExamDetail(ex);U.examId=null;
  var list=Object.keys(S.exams).map(getExam);
  var body=list.length?'<div class="tablewrap"><table><thead><tr><th>পরীক্ষা</th><th>জামাত</th><th class="num">সাল</th><th class="num">কিতাব/বিষয়</th><th class="num">নম্বর তোলা হয়েছে</th><th></th></tr></thead><tbody>'
   +list.map(function(e){var ss=studentsOf(e.cls),done=ss.filter(function(s){return calc(e,e.marks[s.id]||{}).complete;}).length;
     return '<tr><td class="nm"><b>'+esc(e.name)+'</b>'+(e.sample?' <span class="chip plain">উদাহরণ</span>':'')+'</td><td>'+esc(e.cls)+'</td><td class="num">'+bn(esc(e.year||''))+'</td><td class="num">'+bn(e.subjects.length)+'</td><td class="num">'+bn(done)+' / '+bn(ss.length)+'</td><td><button class="btn sm" data-act="openExam" data-id="'+e.id+'">খুলুন</button></td></tr>';}).join('')+'</tbody></table></div>'
   :'<div class="card empty"><h2>এখনো কোনো পরীক্ষা তৈরি হয়নি</h2><p class="muted">পরীক্ষার নাম, জামাত ও কিতাবের তালিকা দিলে নম্বর তোলার ছক তৈরি হবে। মোট, শতকরা, মরতবা ও মেধাক্রম নিজে থেকেই হিসাব হয়।</p></div>';
  return '<section class="block"><div class="rowhead"><h2>পরীক্ষা ও ফলাফল</h2><button class="btn primary" data-act="newExam">নতুন পরীক্ষা</button></div>'+body+'</section>';
}
function vExamDetail(ex){
  var rows=examRows(ex),max=ex.subjects.reduce(function(a,s){return a+s.max;},0);
  var head='<th class="num">রোল</th><th>নাম</th>'+ex.subjects.map(function(s){return '<th class="num">'+esc(s.n)+'<br><span class="muted">/ '+bn(s.max)+'</span></th>';}).join('')+'<th class="num">মোট<br><span class="muted">/ '+bn(max)+'</span></th><th class="num">শতকরা</th><th>মরতবা</th><th class="num">মেধাক্রম</th><th>ফলাফল</th>';
  var body=rows.map(function(r){return '<tr data-sid="'+r.s.id+'"><td class="num">'+bn(esc(r.s.roll))+'</td><td class="nm"><b>'+esc(r.s.name)+'</b></td>'
    +ex.subjects.map(function(s,i){var v=r.vals[i];return '<td class="num"><input class="mk" inputmode="decimal" autocomplete="off" aria-label="'+esc(r.s.name)+' — '+esc(s.n)+'" data-in="mark" data-sid="'+r.s.id+'" data-i="'+i+'" value="'+esc(v==null?'':bn(v))+'"></td>';}).join('')
    +'<td class="num" data-c="total"></td><td class="num" data-c="pct"></td><td data-c="grade"></td><td class="num" data-c="rank"></td><td data-c="res"></td></tr>';}).join('');
  return '<section class="block"><div class="rowhead"><div><button class="btn sm" data-act="backExams">← সব পরীক্ষা</button></div>'
   +'<div class="btns"><button class="btn sm" data-act="editExam">নাম/সাল বদলান</button><button class="btn sm danger'+(U.confirm==='exam'?' sure':'')+'" data-act="delExam">'+(U.confirm==='exam'?'নিশ্চিত করুন, মুছে ফেলুন':'পরীক্ষা মুছুন')+'</button></div></div>'
   +'<div><h2>'+esc(ex.name)+(ex.year?' — '+bn(esc(ex.year)):'')+'</h2><p class="muted">'+esc(ex.cls)+' · পাস নম্বর প্রতি বিষয়ে '+bn(settings().passPct)+'%</p></div>'
   +(rows.length?'<div class="tablewrap"><table><thead><tr>'+head+'</tr></thead><tbody id="markbody">'+body+'</tbody></table></div>'
   +'<div class="btns"><button class="btn primary" data-act="saveMarks">নম্বর সংরক্ষণ করুন</button><button class="btn" data-act="msheet">মার্কশিট ফাইল (প্রিন্টের জন্য)</button><button class="btn" data-act="examCsv">ফলাফল CSV</button></div>'
   +'<p class="muted small">মেধাক্রম শুধু উত্তীর্ণ ছাত্রদের মধ্যে মোট নম্বর অনুযায়ী হয়। সমান নম্বরে একই মেধাক্রম বসে।</p>'
   :'<div class="card empty"><p class="muted">এই জামাতে কোনো ছাত্র নেই। আগে ছাত্র যোগ করুন।</p></div>')+'</section>';
}
function markPaint(){
  var ex=getExam(U.examId);if(!ex)return;
  examRows(ex).forEach(function(r){var tr=document.querySelector('#markbody tr[data-sid="'+r.s.id+'"]');if(!tr)return;var c=r.c;
    var set=function(k,h){tr.querySelector('[data-c="'+k+'"]').innerHTML=h;};
    set('total',c.filled?bn(Math.round(c.total*100)/100):'—');
    set('pct',c.filled?fp(c.pct)+'%':'—');
    set('grade',c.complete?esc(c.grade):'—');
    set('rank',r.rank?bn(r.rank):'—');
    set('res',c.over?'<span class="chip bad">পূর্ণমান ছাড়িয়েছে</span>':'<span class="chip '+(c.result==='উত্তীর্ণ'?'good':(c.result==='অনুত্তীর্ণ'?'bad':'plain'))+'">'+c.result+'</span>');
    tr.querySelectorAll('input.mk').forEach(function(inp){var n=inp.value.trim()===''?null:num(inp.value),mx=ex.subjects[+inp.dataset.i].max;inp.classList.toggle('over',n!=null&&(n>mx||n<0));});
  });
}
function parseSubjects(text){
  return text.split('\n').map(function(l){l=l.trim();if(!l)return null;var m=l.match(/^(.*?)[,،:]\s*([0-9০-৯.]+)\s*$/);var n=m?m[1].trim():l,mx=m?num(m[2]):100;return n&&mx>0?{n:n,max:mx}:null;}).filter(Boolean);
}
function subjectLines(cls){var cs=coursesOf(cls);return cs.length?cs.map(function(c){return c.name+', 100';}).join('\n'):'কুরআন, 100\nহাদিস, 100\nফিকহ, 100';}
function examForm(edit){
  var ex=edit&&getExam(U.examId);U.modalKind=edit?'examEdit':'examNew';U.subjTouched=false;
  var c0=U.fcls||U.attCls||settings().classes[0];
  showModal('<h2>'+(edit?'পরীক্ষার নাম ও সাল':'নতুন পরীক্ষা')+'</h2><div class="fgrid">'
   +'<div class="f"><label for="f-ename">পরীক্ষার নাম *</label><input id="f-ename" value="'+esc(ex?ex.name:'')+'" placeholder="যেমন ষান্মাসিক পরীক্ষা" autocomplete="off"></div>'
   +'<div class="f"><label for="f-eyear">সাল</label><input id="f-eyear" inputmode="numeric" value="'+esc(ex?ex.year:new Date().getFullYear())+'" autocomplete="off"></div>'
   +(edit?'':'<div class="f"><label for="f-ecls">জামাত *</label><select id="f-ecls" data-ch="ecls">'+classOptions(c0,false)+'</select></div>')
   +'</div>'
   +(edit?'<p class="muted small">কিতাব ও পূর্ণমান তৈরির পরে বদলানো যায় না, কারণ তোলা নম্বর এলোমেলো হয়ে যেতে পারে। বদলাতে হলে নতুন পরীক্ষা তৈরি করুন।</p>'

function saveExam(){
  var v=function(i){var e=document.getElementById(i);return e?e.value.trim():'';};
  if(!v('f-ename')){toast('পরীক্ষার নাম লিখুন','bad');return;}
  if(U.modalKind==='examEdit'){var ex=getExam(U.examId);ex.name=v('f-ename');ex.year=en(v('f-eyear'));put('exams',ex.id,stripExam(ex));closeModal();render();toast('সংরক্ষিত হয়েছে');return;}
  if(!v('f-ecls')){toast('জামাত নির্বাচন করুন','bad');return;}
  var subs=parseSubjects(document.getElementById('f-esubj').value);
  if(!subs.length){toast('অন্তত একটি কিতাব লিখুন','bad');return;}
  var id=uid();put('exams',id,{name:v('f-ename'),year:en(v('f-eyear')),cls:v('f-ecls'),subjects:subs,marks:{},sample:false});
  U.examId=id;closeModal();render();toast('পরীক্ষা তৈরি হয়েছে। এবার নম্বর তুলুন।');
}
function stripExam(ex){var o=clone(ex);delete o.id;return o;}
function saveMarks(silent){
  var ex=getExam(U.examId);if(!ex)return false;
  var marks=ex.marks,rows=studentsOf(ex.cls);
  for(var k=0;k<rows.length;k++){
    var s=rows[k],vals=getVals(ex,s.id),entry={};
    for(var i=0;i<ex.subjects.length;i++){var v=vals[i];if(v===''||v==null)continue;var n=num(v);
      if(n==null||n<0||n>ex.subjects[i].max){toast(s.name+' — '+ex.subjects[i].n+': নম্বর ০ থেকে '+bn(ex.subjects[i].max)+'-এর মধ্যে হতে হবে','bad');return false;}
      entry[i]=n;}
    if(Object.keys(entry).length)marks[s.id]=entry;else delete marks[s.id];
  }
  ex.marks=marks;put('exams',ex.id,stripExam(ex));delete U.markDraft[ex.id];
  if(!silent){render();toast('নম্বর সংরক্ষিত হয়েছে');}
  return true;
}

/* ---------- hifz (বিভাগ ৭: হিফজ ও তিলাওয়াত অগ্রগতি) ---------- */
function hifzPool(){var all=studentsOf('');var h=all.filter(function(s){return s.dept===HIFZ;});return h.length?h:all;}
function hfKey(){return U.hfDate+'|'+U.hfCls;}
function hfEntry(sid,date){var d=S.hifz[sid+'_'+date.slice(0,4)];return d&&d.days&&d.days[date.slice(5)]||null;}
function hfVal(sid,f){var d=U.hfDraft[hfKey()];if(d&&d[sid]&&d[sid][f]!=null)return d[sid][f];var e=hfEntry(sid,U.hfDate);return e&&e[f]!=null?e[f]:'';}
function hfEntries(sid){var out=[];Object.keys(S.hifz).forEach(function(k){var d=S.hifz[k];if(d.sid!==sid)return;Object.keys(d.days||{}).forEach(function(m){out.push(Object.assign({date:d.year+'-'+m},d.days[m]));});});return out.sort(function(a,b){return a.date<b.date?1:-1;});}
function hfEvals(sid){var out=[];Object.keys(S.hifz).forEach(function(k){var d=S.hifz[k];if(d.sid!==sid)return;Object.keys(d.evals||{}).forEach(function(m){out.push(Object.assign({month:m},d.evals[m]));});});return out.sort(function(a,b){return a.month<b.month?1:-1;});}

  var classes=uniq(pool.map(function(s){return s.cls;}));
  if(classes.indexOf(U.hfCls)<0)U.hfCls=classes[0];
  var ss=pool.filter(function(s){return s.cls===U.hfCls;});
  if(!U.hfSid||!pool.some(function(s){return s.id===U.hfSid;}))U.hfSid=ss[0].id;
  var rows=ss.map(function(s){var inp=function(f,cls,extra){return '<td><input class="'+cls+'" data-in="hf" data-sid="'+s.id+'" data-f="'+f+'" value="'+esc(f==='p'?bn(hfVal(s.id,f)):hfVal(s.id,f))+'" autocomplete="off" aria-label="'+esc(s.name)+' — '+f+'"'+(extra||'')+'></td>';};
    return '<tr><td class="num">'+bn(esc(s.roll))+'</td><td class="nm"><b>'+esc(s.name)+'</b></td>'+inp('p','mk',' inputmode="numeric"')+inp('s','hf')+inp('q','hf')+inp('a','hf')
     +'<td><select class="hf" data-in="hf" data-sid="'+s.id+'" data-f="r" aria-label="'+esc(s.name)+' — মান"><option value="">—</option>'+RATES.map(function(r){return '<option'+(hfVal(s.id,'r')===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select></td></tr>';}).join('');
  return '<section class="block"><h2>হিফজ ও তিলাওয়াত</h2>'
   +(pool.some(function(s){return s.dept!==HIFZ;})?'<div class="note warn">"হিফজ" বিভাগের কোনো ছাত্র নেই, তাই সব ছাত্র দেখানো হচ্ছে। ছাত্রের তথ্যে বিভাগ "হিফজ" দিলে শুধু তারা আসবে।</div>':'')
   +'<div class="filters2"><div class="f"><label for="hfDate">তারিখ</label><input id="hfDate" type="date" data-ch="hfDate" value="'+esc(U.hfDate)+'"></div>'
   +'<div class="f"><label for="hfCls">জামাত</label><select id="hfCls" data-ch="hfCls">'+classes.map(function(c){return '<option value="'+esc(c)+'"'+(c===U.hfCls?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div></div>'
   +'<div class="tablewrap"><table><thead><tr><th class="num">রোল</th><th>নাম</th><th class="num">পারা</th><th>সবক</th><th>সবকি</th><th>আমুখতা</th><th>মান</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="btns"><button class="btn primary" data-act="hfSave">দৈনিক হিসাব সংরক্ষণ করুন</button></div>'
   +'<p class="muted small">পারা: ১ থেকে ৩০। সবক হলো নতুন পড়া, সবকি সাম্প্রতিক পড়ার পুনরাবৃত্তি, আমুখতা পুরনো পড়ার পুনরাবৃত্তি। যেমন "পৃষ্ঠা ২-৩"।</p></section>'
   +hfStudentPanel(pool);
}

   +(es.length?'<div class="tablewrap"><table><thead><tr><th class="num">তারিখ</th><th class="num">পারা</th><th>সবক</th><th>সবকি</th><th>আমুখতা</th><th>মান</th></tr></thead><tbody>'+elast+'</tbody></table></div><p class="muted small">সর্বশেষ '+bn(Math.min(10,es.length))+'টি হিসাব দেখানো হচ্ছে।</p>':'<p class="muted">এই ছাত্রের দৈনিক হিসাব এখনো নেই।</p>')

}
function hfSave(){
  var ss=hifzPool().filter(function(s){return s.cls===U.hfCls;}),year=U.hfDate.slice(0,4),key=U.hfDate.slice(5),n=0;
  for(var k=0;k<ss.length;k++){
    var s=ss[k],e={},id=s.id+'_'+year;
    var p=hfVal(s.id,'p');
    if(String(p).trim()!==''){var pn=num(p);if(pn==null||pn<1||pn>30||pn!==Math.floor(pn)){toast(s.name+': পারা ১ থেকে ৩০-এর মধ্যে একটি সংখ্যা হতে হবে','bad');return;}e.p=pn;}
    ['s','q','a','r'].forEach(function(f){var v=String(hfVal(s.id,f)).trim();if(v)e[f]=v;});
    var old=S.hifz[id],has=!!hfEntry(s.id,U.hfDate);
    if(!Object.keys(e).length&&!has)continue;
    var doc=old?clone(old):{sid:s.id,year:year,days:{},evals:{},sample:false};doc.days=doc.days||{};

}

}

function attOf(sid,days){var p=0,a=0,l=0;days.forEach(function(d){var v=(S.attendance[d].records||{})[sid];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++;});return {p:p,a:a,l:l,t:p+a+l};}
function allExams(){return Object.keys(S.exams).map(getExam).sort(function(a,b){return (num(a.year)||0)-(num(b.year)||0);});}
function latestExam(cls){var l=allExams().filter(function(e){return e.cls===cls;});return l.length?l[l.length-1]:null;}
function examSummary(ex){
  var rows=examRows(ex,true).filter(function(r){return r.c.complete&&!r.c.over;});
  if(!rows.length)return null;
  var passed=rows.filter(function(r){return !r.c.fail;}),sum=0;rows.forEach(function(r){sum+=r.c.pct;});
  var dist={};settings().grades.slice().sort(function(a,b){return b.min-a.min;}).forEach(function(g){dist[g.n]=0;});
  rows.forEach(function(r){dist[r.c.grade]=(dist[r.c.grade]||0)+1;});
  var subj=ex.subjects.map(function(s,i){var t=0;rows.forEach(function(r){t+=num(r.vals[i])/s.max*100;});return {n:s.n,avg:t/rows.length};});
  var top=passed.slice().sort(function(a,b){return b.c.total-a.c.total;}).slice(0,3);
  return {n:rows.length,pass:passed.length,avg:sum/rows.length,rate:passed.length/rows.length*100,dist:dist,subj:subj,top:top};
}
function weakList(){
  var st=settings(),days=Object.keys(S.attendance),out=[];
  studentsOf('').forEach(function(s){var rs=[],at=attOf(s.id,days);
    if(at.t>=5){var r=Math.round(at.p/at.t*100);if(r<st.minAtt)rs.push({k:'bad',t:'উপস্থিতি '+bn(r)+'%'});}
    var ex=latestExam(s.cls);
    if(ex){var c=calc(ex,(ex.marks[s.id]||{}));
      if(c.complete&&!c.over){
        if(c.fail){var fl=ex.subjects.filter(function(sub,i){return num((ex.marks[s.id]||{})[i])<sub.max*st.passPct/100;}).map(function(sub){return sub.n;});rs.push({k:'bad',t:'অনুত্তীর্ণ: '+fl.join(', ')});}
        else if(c.pct<st.weakPct)rs.push({k:'warn',t:'শতকরা '+fp(c.pct)+'% ('+ex.name+')'});}}
    if(rs.length)out.push({s:s,rs:rs});});
  return out;
}
function classRows(days){
  var all=studentsOf('');
  return uniq(all.map(function(s){return s.cls;})).map(function(c){
    var ss=all.filter(function(s){return s.cls===c;}),p=0,t=0;ss.forEach(function(s){var a=attOf(s.id,days);p+=a.p;t+=a.t;});
    var ex=latestExam(c),sm=ex?examSummary(ex):null;
    return {cls:c,n:ss.length,att:t?p/t*100:null,exName:ex?ex.name+(ex.year?' ('+ex.year+')':''):'',avg:sm?sm.avg:null,rate:sm?sm.rate:null};});
}
function yearRows(){
  var ys={};var get=function(y){return ys[y]=ys[y]||{p:0,t:0,ex:0,n:0,pass:0,sum:0};};
  Object.keys(S.attendance).forEach(function(d){var o=get(d.slice(0,4)),r=S.attendance[d].records||{};Object.keys(r).forEach(function(sid){if(!S.students[sid])return;o.t++;if(r[sid]==='P')o.p++;});});
  allExams().forEach(function(ex){var y=en(String(ex.year||''));if(!y)return;var o=get(y),sm=examSummary(ex);o.ex++;if(sm){o.n+=sm.n;o.pass+=sm.pass;o.sum+=sm.avg*sm.n;}});
  return Object.keys(ys).sort().map(function(y){var o=ys[y];return {y:y,att:o.t?o.p/o.t*100:null,ex:o.ex,n:o.n,rate:o.n?o.pass/o.n*100:null,avg:o.n?o.sum/o.n:null};});

  var classes=lines('s-classes'),depts=lines('s-depts');

function childSummary(s){
  var att=[];Object.keys(S.attendance).sort().forEach(function(d){var v=(S.attendance[d].records||{})[s.id];if(v==='P'||v==='A'||v==='L')att.push([d,v]);});

    var rows=studentsOf(e.cls).map(function(x){return {id:x.id,c:calc(e,e.marks[x.id]||{})};});
    var me=rows.filter(function(r){return r.id===s.id;})[0];if(!me||!me.c.filled)return;
    var ok=rows.filter(function(r){return r.c.complete&&!r.c.fail&&!r.c.over;}).sort(function(a,b){return b.c.total-a.c.total;}),rank=null;
    ok.forEach(function(r,i){r.rk=(i>0&&r.c.total===ok[i-1].c.total)?ok[i-1].rk:i+1;if(r.id===s.id)rank=r.rk;});

var NT_TYPES=['ছুটি','মাদরাসা খোলা','পরীক্ষা','পরীক্ষার ফল','অভিভাবক সভা','অনুপস্থিতি','সাধারণ ঘোষণা'];
function ntGen(){
  var t=U.nt,a=t.d1?fmtDate(t.d1):'',b=t.d2?fmtDate(t.d2):'',n=t.note.trim()?' '+t.note.trim():'';
  var x={
    'ছুটি':b?a+' থেকে '+b+' পর্যন্ত মাদরাসা ছুটি থাকবে।':a+' তারিখে মাদরাসা ছুটি থাকবে।',
    'মাদরাসা খোলা':a+' তারিখ থেকে মাদরাসা পুনরায় খোলা হবে। ছাত্রদের যথাসময়ে উপস্থিত করার অনুরোধ রইল।',
    'পরীক্ষা':a+' তারিখ থেকে'+(b?' '+b+' তারিখ পর্যন্ত':'')+' পরীক্ষা অনুষ্ঠিত হবে। ছাত্রদের প্রস্তুতি নিয়ে যথাসময়ে উপস্থিত করার অনুরোধ রইল।',
    'পরীক্ষার ফল':'পরীক্ষার ফল প্রকাশিত হয়েছে।'+(a?' '+a+' তারিখে ফল সংগ্রহ করা যাবে।':''),
    'অভিভাবক সভা':a+' তারিখে অভিভাবক সভা অনুষ্ঠিত হবে। আপনার উপস্থিতি কামনা করছি।',
    'অনুপস্থিতি':'ছাত্র {ছাত্র} ({জামাত}) '+a+' তারিখে মাদরাসায় অনুপস্থিত ছিল। অনুপস্থিতির কারণ জানানোর অনুরোধ রইল।',
    'সাধারণ ঘোষণা':''
  }[t.tpl];
  return 'আস্সালামু আলাইকুম। '+(x||'')+n+'\n— '+settings().name;
}
function waNum(p){var d=en(p||'').replace(/\D/g,'');if(!d)return '';if(d.indexOf('880')===0)return d;if(d.charAt(0)==='0')return '88'+d;return d;}

function ntRecipients(){
